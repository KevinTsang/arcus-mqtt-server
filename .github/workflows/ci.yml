name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the node:22-alpine runtime in the Dockerfile
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
